<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Davomat</title>

  <!--
    Brauzerda kamera va GPS ishlashi uchun SHART:
    1. Sayt HTTPS da bo'lishi kerak (HTTP'da getUserMedia va geolocation BLOKLANADI)
    2. Foydalanuvchi ruxsat berishi kerak
  -->

  <link rel="stylesheet" href="style.css" />

  <style>
    /* Brauzerda video CSS mirror — JS canvas'dan ishonchlirok */
    #camera {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #111;
      transform: scaleX(-1);
      -webkit-transform: scaleX(-1);
    }
    #captured-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <span class="status">Davomat</span>
      <span class="dot"></span>
    </header>

    <section class="panel" id="main-panel">
      <div class="toggle">
        <button class="tab active" data-type="KIRISH">Kirish</button>
        <button class="tab" data-type="CHIQISH">Chiqish</button>
      </div>

      <div class="hint" id="hint-text">Yuzingizni doira ichida joylashtiring</div>

      <div class="preview" id="preview-box">
        <video
          id="camera"
          autoplay
          playsinline
          muted
          webkit-playsinline
        ></video>
        <img id="captured-image" alt="selfie" />
        <div class="frame"></div>
      </div>

      <div class="info-card">
        <div class="info-row">
          <span>Joylashuv</span>
          <span id="location-status">Aniqlanmoqda...</span>
        </div>
        <div class="info-row">
          <span>Vaqt</span>
          <span id="clock">00:00:00</span>
        </div>
      </div>

      <button id="capture" class="action primary">📷 Rasm olish</button>
      <button id="retake" class="action secondary hidden">🔄 Qaytadan olish</button>
      <button id="submit" class="action secondary hidden">✅ Tasdiqlash</button>
      <div id="message" class="message"></div>
    </section>

    <section class="panel hidden" id="success-panel">
      <div class="success-screen">
        <div class="success-icon" id="success-icon">🟢</div>
        <div class="success-title">Muvaffaqiyatli!</div>
        <div class="success-sub" id="success-sub">Kirish qayd etildi ✓</div>
        <div class="success-info" id="success-info"></div>
        <button class="action primary" onclick="closeApp()">Yopish</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
