<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <!--
    FIX 1: user-scalable=no — Android'da zoom bo'lishini oldini oladi
    FIX 2: viewport-fit=cover — iPhone notch uchun
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!--
    FIX 3: HTTPS shart — HTTP'da getUserMedia va geolocation ISHLAMAYDI
    Quyidagi meta HTTPS'ga yo'naltirish uchun emas, shunchaki eslatma
  -->

  <!--
    FIX 4: Telegram WebApp kamera ruxsatini so'rashi uchun
    Bu meta Android Telegram'da kamera permission dialogini ishga tushiradi
  -->
  <meta http-equiv="Permissions-Policy" content="camera=*, microphone=(), geolocation=*" />

  <title>Davomat</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    /*
      FIX 5: Android'da video qorong'u bo'lishining CSS sababi —
      ba'zi Android brauzerlar video'ni transform yoki overflow:hidden
      ichida to'g'ri render qilmaydi. Quyidagi stil buni tuzatadi.
    */
    #camera {
      /* Hardware acceleration majburan yoqamiz */
      -webkit-transform: scaleX(-1);
      transform: scaleX(-1);
      /* Android WebView uchun GPU layer yaratamiz */
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      will-change: transform;
      /* O'lcham aniq bo'lishi kerak */
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #111;
    }

    /* Rasm olinganda mirror qo'llamaymiz */
    #captured-image {
      -webkit-transform: none;
      transform: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <span class="status">Davomat</span>
      <span class="dot"></span>
    </header>

    <!-- ASOSIY PANEL -->
    <section class="panel" id="main-panel">
      <div class="toggle">
        <button class="tab active" data-type="KIRISH">Kirish</button>
        <button class="tab" data-type="CHIQISH">Chiqish</button>
      </div>

      <div class="hint" id="hint-text">Yuzingizni doira ichida joylashtiring</div>

      <div class="preview" id="preview-box">
        <!--
          FIX 6: video tegi — barcha muhim atributlar bir joyda
          - autoplay: avtomatik boshlash
          - playsinline: iOS + Android WebView'da fullscreen emas, inline
          - muted: Android'da autoplay faqat muted bilan ishlaydi
          - webkit-playsinline: eski iOS uchun
        -->
        <video
          id="camera"
          autoplay
          playsinline
          muted
          webkit-playsinline
          x-webkit-airplay="deny"
        ></video>
        <img id="captured-image" alt="selfie" />
        <div class="frame"></div>
      </div>

      <div class="info-card">
        <div class="info-row">
          <span>Joylashuv</span>
          <span id="location-status">Aniqlanmoqda...</span>
        </div>
        <div class="info-row">
          <span>Vaqt</span>
          <span id="clock">00:00:00</span>
        </div>
      </div>

      <button id="capture" class="action primary">📷 Rasm olish</button>
      <button id="retake" class="action secondary hidden">🔄 Qaytadan olish</button>
      <button id="submit" class="action secondary hidden">✅ Tasdiqlash</button>
      <div id="message" class="message"></div>
    </section>

    <!-- TASDIQ EKRANI -->
    <section class="panel hidden" id="success-panel">
      <div class="success-screen">
        <div class="success-icon" id="success-icon">🟢</div>
        <div class="success-title">Muvaffaqiyatli!</div>
        <div class="success-sub" id="success-sub">Kirish qayd etildi ✓</div>
        <div class="success-info" id="success-info"></div>
        <button class="action primary" onclick="closeApp()">Yopish</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
